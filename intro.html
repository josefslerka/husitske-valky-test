<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Husitské války — Intro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 38%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%);
    mix-blend-mode: multiply;
  }
  #ui {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; padding-top: 6vh;
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    color: #f3e2b8; text-align: center;
    text-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0 30px rgba(255,150,50,0.3);
  }
  #title {
    font-size: clamp(2.4rem, 8vw, 6rem); letter-spacing: 0.18em; font-weight: 700; color: #f7dc93;
    opacity: 0; transform: translateY(18px); animation: rise 2.2s ease-out 0.5s forwards;
  }
  #rule { width: 0; height: 2px; margin: 1rem 0 0.6rem;
    background: linear-gradient(90deg, transparent, #d4af4f, transparent);
    animation: grow 2s ease-out 1.5s forwards; }
  #years { font-size: clamp(0.9rem, 2.4vw, 1.4rem); letter-spacing: 0.5em; color: #ddc98e;
    opacity: 0; animation: fade 1.6s ease-out 2s forwards; }
  #hymn { margin-top: 1.3rem; font-style: italic; font-size: clamp(1rem, 3vw, 1.7rem); color: #f0d69a;
    opacity: 0; transform: translateY(10px); animation: rise 2.4s ease-out 3.3s forwards; }

  #enter {
    position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%);
    z-index: 4; pointer-events: auto; font-family: inherit;
    font-size: clamp(0.9rem, 2vw, 1.15rem); letter-spacing: 0.28em;
    color: #f3e2b8; background: rgba(20,14,6,0.6); border: 1px solid #7c6222; border-radius: 4px;
    padding: 0.85em 2.2em; cursor: pointer; text-shadow: 0 0 10px rgba(255,180,60,0.4);
    box-shadow: 0 0 24px rgba(0,0,0,0.6), inset 0 0 18px rgba(255,170,60,0.08);
    opacity: 0; animation: fade 1.6s ease-out 4.8s forwards;
    transition: background 0.25s, box-shadow 0.25s, color 0.25s, transform 0.1s;
  }
  #enter:hover { background: rgba(60,40,12,0.85); color: #fff2cf;
    box-shadow: 0 0 34px rgba(255,180,60,0.35), inset 0 0 22px rgba(255,170,60,0.18); }
  #enter:active { transform: translateX(-50%) scale(0.97); }
  #skip { position: fixed; right: 18px; bottom: 14px; z-index: 4; pointer-events: auto;
    font-family: inherit; font-size: 0.8rem; letter-spacing: 0.2em; color: #8a7a4e;
    background: none; border: none; cursor: pointer; opacity: 0; animation: fade 1s ease 1.5s forwards; }
  #skip:hover { color: #d8c48a; }
  #hint { position: fixed; left: 50%; top: 52%; transform: translate(-50%,-50%);
    color: #6b5c38; font-family: serif; z-index: 1; }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { width: min(360px, 60vw); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app"></div>
  <div id="hint">svítá nad táborem…</div>
  <div id="vignette"></div>
  <div id="ui">
    <div id="title">HUSITSKÉ&nbsp;VÁLKY</div>
    <div id="rule"></div>
    <div id="years">1419 — 1437</div>
    <div id="hymn">„Kdož jsú boží bojovníci a zákona jeho…"</div>
  </div>
  <button id="enter" onclick="try{sessionStorage.setItem('introSeen','1')}catch(e){}; location.href='index.html'">▶ &nbsp;VSTOUPIT DO HRY</button>
  <button id="skip" onclick="try{sessionStorage.setItem('introSeen','1')}catch(e){}; location.href='index.html'">PŘESKOČIT ›</button>

<script type="module">
import * as THREE from 'three';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2a1620, 0.017);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 2.6, 19);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

// ---------- Obloha: svítání za armádou ----------
function makeSky() {
  const c = document.createElement('canvas'); c.width = 16; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0.00, '#ffcf7a'); // horizont (dole na obrázku -> spodní pól koule)
  grd.addColorStop(0.14, '#f0761f');
  grd.addColorStop(0.34, '#7c2c14');
  grd.addColorStop(0.62, '#301636');
  grd.addColorStop(1.00, '#080a1e'); // zenit
  g.fillStyle = grd; g.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 32, 16),
  new THREE.MeshBasicMaterial({ map: makeSky(), side: THREE.BackSide, fog: false })
);
scene.add(sky);
// slunce/žár na horizontu
const sunTex = glowTex('rgba(255,240,200,1)', 'rgba(255,150,50,0.6)', 'rgba(255,120,40,0)');
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTex, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9 }));
sun.scale.set(44, 44, 1); sun.position.set(-6, 3, -60); scene.add(sun);

// ---------- Světla ----------
scene.add(new THREE.AmbientLight(0x33304a, 0.85));
const dawn = new THREE.DirectionalLight(0xff8a3c, 2.3);   // zezadu od svítání -> lemuje siluety
dawn.position.set(-8, 5, -40); scene.add(dawn);
const backFill = new THREE.DirectionalLight(0x5566aa, 0.5);
backFill.position.set(6, 8, -20); scene.add(backFill);

// ---------- Země ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x0c0a10, roughness: 1 })
);
ground.rotation.x = -Math.PI/2; scene.add(ground);

const dark = new THREE.MeshStandardMaterial({ color: 0x08070c, roughness: 1, metalness: 0 });

function glowTex(a, b, c) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(32,32,0, 32,32,32);
  grd.addColorStop(0, a); grd.addColorStop(0.4, b); grd.addColorStop(1, c);
  g.fillStyle = grd; g.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// Zlatý kalich (husitský znak) kreslený na kanvas -> textura na korouhev
function makeChaliceTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#ffd98a'; g.strokeStyle = '#7a4e0c'; g.lineWidth = 3; g.lineJoin = 'round';
  // číše (bowl)
  g.beginPath();
  g.moveTo(26, 28); g.lineTo(102, 28);
  g.quadraticCurveTo(92, 74, 64, 78);
  g.quadraticCurveTo(36, 74, 26, 28);
  g.closePath(); g.fill(); g.stroke();
  // nožka (stem)
  g.beginPath(); g.rect(59, 76, 10, 22); g.fill(); g.stroke();
  // uzel (knop)
  g.beginPath(); g.ellipse(64, 86, 8, 5.5, 0, 0, Math.PI*2); g.fill(); g.stroke();
  // pata (foot)
  g.beginPath();
  g.moveTo(40, 108); g.lineTo(88, 108); g.lineTo(74, 98); g.lineTo(54, 98);
  g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(64, 108, 24, 5.5, 0, 0, Math.PI*2); g.fill(); g.stroke();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const chaliceTex = makeChaliceTex();

// ---------- Válečný vůz ----------
function makeWagon() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.15, 1.4), dark);
  body.position.y = 1.05; g.add(body);
  // prkenná hradba (mantinel) na straně k nepříteli (-z)
  const wall = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.7, 0.16), dark);
  wall.position.set(0, 1.5, -0.7); g.add(wall);
  // střílny naznačíme zuby nahoře
  for (let i = -1; i <= 1; i++) {
    const merlon = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.2), dark);
    merlon.position.set(i*0.95, 2.35, -0.7); g.add(merlon);
  }
  const wheelGeo = new THREE.CylinderGeometry(0.62, 0.62, 0.2, 20);
  for (const [x, z] of [[-1.1,0.6],[1.1,0.6],[-1.1,-0.6],[1.1,-0.6]]) {
    const w = new THREE.Mesh(wheelGeo, dark);
    w.rotation.z = Math.PI/2; w.position.set(x, 0.62, z); g.add(w);
  }
  return g;
}

// ---------- Boží bojovník (silueta) ----------
const idlers = [];
function makeWarrior(weapon) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.28, 1.0, 8), dark);
  body.position.y = 0.8; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), dark);
  head.position.y = 1.42; g.add(head);
  // klobouk/přilba náznak
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.18, 10), dark);
  hat.position.y = 1.56; g.add(hat);

  let arm = null;
  if (weapon === 'flail' || weapon === 'spear') {
    arm = new THREE.Group();
    const len = weapon === 'spear' ? 2.1 : 1.5;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, len, 6), dark);
    pole.position.y = len/2; arm.add(pole);
    if (weapon === 'spear') {
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.28, 6), dark);
      tip.position.y = len + 0.12; arm.add(tip);
    } else { // cep
      const link = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.32, 5), dark);
      link.position.set(0.05, len + 0.12, 0); link.rotation.z = -0.5; arm.add(link);
      const club = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.34, 0.15), dark);
      club.position.set(0.18, len + 0.28, 0); club.rotation.z = -0.5; arm.add(club);
    }
    arm.position.set(0.26, 0.55, 0.05);
    arm.rotation.z = 0.12 + Math.random()*0.1;
    g.add(arm);
  } else if (weapon === 'pavise') {
    const shield = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.35, 0.1), dark);
    shield.position.set(0, 0.8, 0.32); g.add(shield);
  }
  idlers.push({ g, arm, phase: Math.random()*Math.PI*2, sway: 0.5+Math.random() });
  return g;
}

// ---------- Sestavení hradby + houfu ----------
const fort = new THREE.Group(); scene.add(fort);
const wagonXs = [-10.5, -6.3, -2.1, 2.1, 6.3, 10.5];
for (const x of wagonXs) {
  const w = makeWagon(); w.position.set(x, 0, -2 + (Math.random()*0.3-0.15));
  w.rotation.y = (Math.random()*0.06-0.03); fort.add(w);
}
// pavézníci v mezerách mezi vozy (kryjí střílny), čelem k nepříteli (-z)
for (const x of [-8.4, -4.2, 0, 4.2, 8.4]) {
  const p = makeWarrior('pavise'); p.position.set(x, 0, -0.6);
  p.rotation.y = Math.PI; fort.add(p); // štít na -z
}
// houfec za hradbou se zdviženými zbraněmi
const weapons = ['flail','spear','flail','spear','flail'];
for (let i = 0; i < 22; i++) {
  const x = -11 + (i/21)*22 + (Math.random()*0.8-0.4);
  const z = 0.4 + Math.random()*2.4;
  const wk = weapons[(Math.random()*weapons.length)|0];
  const m = makeWarrior(wk);
  m.position.set(x, 0, z);
  m.rotation.y = Math.PI + (Math.random()*0.3-0.15); // čelem dozadu (k nepříteli/svítání)
  m.scale.setScalar(0.92 + Math.random()*0.22);
  fort.add(m);
}

// ---------- Korouhve (rudé, se zlatou hostií/kalichem) ----------
const cloths = [];
function makeBanner(x) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,6.2,8), dark);
  pole.position.y = 3.1; g.add(pole);
  const clothGeo = new THREE.PlaneGeometry(1.8, 2.2, 18, 12);
  const cloth = new THREE.Mesh(clothGeo, new THREE.MeshStandardMaterial({
    color: 0x9c1f1f, roughness: 0.85, side: THREE.DoubleSide,
    emissive: 0x4a0d0d, emissiveIntensity: 0.6 }));
  cloth.position.set(0.95, 4.7, 0); g.add(cloth);
  const emblem = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 1.25),
    new THREE.MeshStandardMaterial({ map: chaliceTex, emissiveMap: chaliceTex,
      emissive: 0xffb844, emissiveIntensity: 1.15, metalness: 0.3, roughness: 0.45,
      transparent: true, alphaTest: 0.4, side: THREE.DoubleSide }));
  emblem.position.set(0.95, 4.7, 0.07); g.add(emblem);
  cloths.push({ mesh: cloth, base: clothGeo.attributes.position.array.slice() });
  g.position.set(x, 0, -1.6); scene.add(g);
}
makeBanner(-6.5); makeBanner(0.6); makeBanner(7.2);

// ---------- Táborové ohně ----------
const fires = [];
function makeFire(x, z) {
  const light = new THREE.PointLight(0xff7a26, 2.6, 22, 1.7);
  light.position.set(x, 1.1, z); scene.add(light);
  const flame = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex('rgba(255,240,190,1)','rgba(255,140,40,0.85)','rgba(255,90,20,0)'),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  flame.scale.set(2.4, 3.0, 1); flame.position.set(x, 1.0, z); scene.add(flame);
  fires.push({ light, flame, base: 2.6, x, z });
}
makeFire(-9, 4.5); makeFire(9, 4.2); makeFire(0, 6);

// ---------- Jiskry ----------
const N = 800;
const epos = new Float32Array(N*3), evel = new Float32Array(N), ecol = new Float32Array(N*3);
const srcs = [[-9,4.5],[9,4.2],[0,6]];
const cA = new THREE.Color(0xff6a12), cB = new THREE.Color(0xffd070);
function resetEmber(i, init) {
  const s = srcs[(Math.random()*srcs.length)|0];
  epos[i*3]   = s[0] + (Math.random()*2-1)*2.5;
  epos[i*3+1] = init ? Math.random()*8 : 0.6 + Math.random()*0.6;
  epos[i*3+2] = s[1] + (Math.random()*2-1)*2.5;
  evel[i] = 0.7 + Math.random()*2.1;
}
for (let i=0;i<N;i++){ resetEmber(i,true); const c=cA.clone().lerp(cB,Math.random());
  ecol[i*3]=c.r; ecol[i*3+1]=c.g; ecol[i*3+2]=c.b; }
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.BufferAttribute(epos,3));
emberGeo.setAttribute('color', new THREE.BufferAttribute(ecol,3));
const embers = new THREE.Points(emberGeo, new THREE.PointsMaterial({
  size: 0.14, map: glowTex('rgba(255,255,255,1)','rgba(255,190,110,0.8)','rgba(255,140,40,0)'),
  vertexColors: true, transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, sizeAttenuation: true }));
scene.add(embers);

// ---------- Bloom (volitelně) ----------
let composer = null, usingBloom = false;
try {
  const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
  const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
  const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.75, 0.35));
  usingBloom = true;
} catch (e) { console.warn('Bloom nedostupný:', e); }
document.getElementById('hint').style.display = 'none';

// ---------- Animace ----------
const clock = new THREE.Clock();
let t = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;

  // kamera: pomalý nájezd na hradbu + jemné kolébání
  const p = Math.min(t/6, 1), e = 1 - Math.pow(1-p, 3);
  camera.position.x = Math.sin(t*0.1) * 1.6;
  camera.position.y = 2.6 - e*0.2 + Math.sin(t*0.5)*0.06;
  camera.position.z = 19 - e*7.5;
  camera.lookAt(0, 3.0, -2);

  // bojovníci: houpání + mávání zbraní
  for (const it of idlers) {
    it.g.position.y = Math.sin(t*1.6 + it.phase) * 0.04;
    if (it.arm) it.arm.rotation.z = 0.14 + Math.sin(t*1.3*it.sway + it.phase) * 0.14;
  }
  // korouhve vlají
  for (const c of cloths) {
    const pos = c.mesh.geometry.attributes.position;
    for (let i=0;i<pos.count;i++){ const x=c.base[i*3], y=c.base[i*3+1];
      const k=(x+0.9)/1.8; pos.setZ(i, Math.sin(x*3.4 + t*3)*0.18*k + Math.sin(y*2+t*1.7)*0.05*k); }
    pos.needsUpdate = true;
  }
  // ohně blikají
  for (const f of fires) {
    const fl = f.base + Math.sin(t*12 + f.x)*0.4 + Math.sin(t*4.7 + f.z)*0.3;
    f.light.intensity = fl;
    f.flame.scale.set(2.2 + Math.sin(t*9+f.x)*0.25, 3.0 + Math.sin(t*7+f.z)*0.35, 1);
  }
  // jiskry stoupají
  for (let i=0;i<N;i++){ epos[i*3+1]+=evel[i]*dt; epos[i*3]+=Math.sin(t*1.2+i)*dt*0.3;
    if (epos[i*3+1]>9) resetEmber(i,false); }
  emberGeo.attributes.position.needsUpdate = true;

  if (usingBloom && composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
